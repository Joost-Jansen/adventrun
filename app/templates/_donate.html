<section class="card card-donate" id="doneren" aria-labelledby="donate-title">
  <h2 id="donate-title">{{ t('donate_title') }}</h2>
  <p>{{ t('donate_body') }}</p>
  {% if action_page_url %}
    <a class="button button-block" href="{{ action_page_url }}" rel="noopener" target="_blank">{{ t('donate_button') }} <span aria-hidden="true">↗</span></a>
  {% else %}
    <p class="soon">{{ t('donate_soon') }}</p>
  {% endif %}
</section>
