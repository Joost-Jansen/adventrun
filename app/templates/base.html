<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Adventsloop: 325 km voor {{ charity }}{% endblock %}</title>
  <meta name="description" content="Van 1 t/m 25 december loopt {{ owner }} elke dag het aantal km van de dag, samen 325 km, voor {{ charity }}.">
  <meta name="robots" content="{% block robots %}index{% endblock %}">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Naar de inhoud</a>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Een persoonlijke actie van {{ owner }}, geen actie van {{ charity }} zelf. Deze site verwerkt geen betalingen.</p>
    <p><a href="/">Start</a> · <a href="/privacy">Privacy</a></p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
